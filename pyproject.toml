[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-apply"
version = "0.0.8"
description = "A tool to automate Google Form submissions at a specific time."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "playwright",
    "tqdm==4.67.0",
    "ntplib==0.4.0",
    "apscheduler==3.11.0",
]
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[project.scripts]
auto-apply = "auto_apply:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "description: 測試案例描述",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests"
]